<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hum notch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&family=Instrument+Serif&display=swap" rel="stylesheet">
  <style>
    :root { --accent: 255 196 150; --p1: 255 196 150; --p2: 140 70 200; --p3: 60 90 200; --p4: 200 90 70; --menu: 37px; --notch: 196px; --ease: cubic-bezier(0.2, 0.8, 0.2, 1); --spring: cubic-bezier(0.34, 1.3, 0.5, 1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: transparent; overflow: hidden; height: 100%; font: 400 13px/1.3 'Geist', system-ui, sans-serif; color: #fff; -webkit-font-smoothing: antialiased; user-select: none; }
    button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
    .i { width: 20px; height: 20px; }

    @property --spin { syntax: '<angle>'; inherits: true; initial-value: 0deg; }
    #n {
      position: absolute; top: 0; left: 50%; translate: -50% 0;
      transition: width 0.55s var(--spring), height 0.55s var(--spring), border-radius 0.55s var(--spring), top 0.4s var(--ease), opacity 0.3s;
    }
    /* molten light from the song's colours, bleeding out around the island */
    .glow {
      position: absolute; inset: -10px; border-radius: inherit; pointer-events: none;
      background: conic-gradient(from var(--spin), rgb(var(--p1)), rgb(var(--p2)), rgb(var(--p3)), rgb(var(--p4)), rgb(var(--p1)));
      filter: blur(20px) saturate(1.5); opacity: 0.6; animation: spin 7s linear infinite; transition: opacity 0.6s, inset 0.55s var(--spring);
    }
    body.playing .glow { opacity: 0.92; }
    body.idle .glow { opacity: 0; }
    #n.bump .glow { opacity: 1; inset: -15px; }
    #n.open .glow { inset: -16px; opacity: 0.7; }
    @keyframes spin { to { --spin: 360deg; } }
    .body { position: absolute; inset: 0; overflow: hidden; border-radius: inherit; background: #000; box-shadow: 0 18px 40px -16px rgb(0 0 0 / 0.7), inset 0 0 0 1px rgb(255 255 255 / 0.07); }
    .body::before {
      content: ''; position: absolute; inset: -60%; pointer-events: none; opacity: 0.4; mix-blend-mode: screen; filter: blur(18px);
      background:
        radial-gradient(30% 40% at 30% 40%, rgb(var(--p2) / 0.9), transparent 70%),
        radial-gradient(35% 45% at 70% 60%, rgb(var(--p3) / 0.8), transparent 70%),
        radial-gradient(25% 35% at 55% 30%, rgb(var(--p1) / 0.7), transparent 70%);
      animation: molten 12s ease-in-out infinite alternate;
    }
    #n.open .body::before { opacity: 0.28; }
    @keyframes molten { 0% { transform: translate(-8%, -6%) rotate(0deg) scale(1); } 100% { transform: translate(8%, 6%) rotate(40deg) scale(1.15); } }
    .compact, .full { z-index: 1; }
    /* A Mac with a notch: the island wraps the hardware notch, flat on top. */
    body.has-notch #n { width: calc(var(--notch) + 96px); height: var(--menu); border-radius: 0 0 14px 14px; }
    /* Everywhere else: a floating pill at the top of the screen. */
    body:not(.has-notch) #n { top: 8px; width: var(--pill, 240px); height: 36px; border-radius: 20px; }
    body.idle #n { opacity: 0.85; }
    #n.open { width: 420px !important; height: calc(196px + var(--pad)) !important; border-radius: 0 0 32px 32px; }
    body:not(.has-notch) #n.open { border-radius: 30px; }
    body.has-notch { --pad: var(--menu); }
    body:not(.has-notch) { --pad: 0px; }

    .compact { position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 8px; transition: opacity 0.2s; }
    #n.open .compact { opacity: 0; pointer-events: none; }
    .art { width: 22px; height: 22px; border-radius: 6px; object-fit: cover; background: #1a1a1a; flex: none; }
    .line { flex: 1; min-width: 0; margin: 0 10px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    body.has-notch .line { display: none; }
    .bars { display: flex; align-items: flex-end; gap: 2.5px; height: 13px; flex: none; }
    .bars i { width: 3px; height: 100%; border-radius: 2px; background: rgb(var(--accent)); transform-origin: bottom; transform: scaleY(0.3); }
    body.playing .bars i { animation: eq 0.9s ease-in-out infinite; }
    .bars i:nth-child(2) { animation-delay: -0.3s !important; animation-duration: 0.7s !important; }
    .bars i:nth-child(3) { animation-delay: -0.55s !important; animation-duration: 1.1s !important; }
    .bars i:nth-child(4) { animation-delay: -0.15s !important; }
    @keyframes eq { 0%, 100% { transform: scaleY(0.25); } 50% { transform: scaleY(1); } }

    .full { position: absolute; inset: 0; padding: calc(var(--pad) + 14px) 20px 14px; display: flex; flex-direction: column; gap: 9px; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    #n.open .full { opacity: 1; pointer-events: auto; transition-delay: 0.14s; }
    .top { display: flex; align-items: center; gap: 12px; min-width: 0; }
    .big { width: 54px; height: 54px; border-radius: 14px; object-fit: cover; background: #1a1a1a; flex: none; box-shadow: 0 10px 24px -10px rgb(var(--accent) / 0.7); }
    .text { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .title { font: 400 22px/1.15 'Instrument Serif', serif; padding-bottom: 0.08em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .artist { font-size: 12.5px; color: rgb(255 255 255 / 0.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .lyric { min-height: 18px; font-weight: 600; font-size: 14px; color: rgb(255 255 255 / 0.9); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 0 18px rgb(var(--accent) / 0.6); }
    .prog { display: grid; grid-template-columns: 34px 1fr 34px; align-items: center; gap: 8px; font-size: 11px; color: rgb(255 255 255 / 0.45); font-variant-numeric: tabular-nums; }
    .prog span:first-child { text-align: right; }
    .track { height: 4px; border-radius: 4px; background: rgb(255 255 255 / 0.16); overflow: hidden; cursor: pointer; }
    .fill { height: 100%; background: rgb(var(--accent)); transform-origin: left; transform: scaleX(0); }
    .controls { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .btn { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; color: rgb(255 255 255 / 0.75); transition: background 0.2s, color 0.2s, transform 0.2s; }
    .btn:hover { background: rgb(255 255 255 / 0.1); color: #fff; }
    .btn:active { transform: scale(0.9); }
    .btn.on { color: rgb(var(--accent)); }
    .play { width: 44px; height: 44px; background: #fff; color: #000; }
    .play:hover { background: #fff; color: #000; transform: scale(1.06); }
    .play .i { width: 18px; height: 18px; }
    .empty { position: absolute; inset: 0; display: none; place-items: center; padding-top: var(--pad); font: italic 400 20px 'Instrument Serif', serif; color: rgb(255 255 255 / 0.7); }
    body.idle .full > :not(.empty) { visibility: hidden; }
    body.idle .empty { display: grid; }
  </style>
</head>
<body class="idle">
  <div id="n">
    <div class="glow"></div>
    <div class="body">
    <div class="compact"><img class="art" alt=""><span class="line">hum</span><span class="bars"><i></i><i></i><i></i><i></i></span></div>
    <div class="full">
      <div class="top">
        <img class="big" alt="">
        <div class="text"><b class="title"></b><span class="artist"></span></div>
        <button class="btn" data-cmd="like" aria-label="Like"></button>
      </div>
      <p class="lyric"></p>
      <div class="prog"><span class="cur">0:00</span><div class="track"><div class="fill"></div></div><span class="dur">0:00</span></div>
      <div class="controls">
        <button class="btn" data-cmd="prev" aria-label="Previous"></button>
        <button class="btn play" data-cmd="toggle" aria-label="Play"></button>
        <button class="btn" data-cmd="next" aria-label="Next"></button>
        <button class="btn" data-cmd="show" aria-label="Open hum"></button>
      </div>
      <div class="empty">Open hum and press play</div>
    </div>
    </div>
  </div>
  <script type="module" src="notch.js"></script>
</body>
</html>
